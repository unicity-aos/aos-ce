name: Linux Realm private lineage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-realm-lineage-${{ github.sha }}
  cancel-in-progress: false

env:
  B3SUM_VERSION: '1.8.5'

jobs:
  candidate:
    name: Build private candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - name: Install pinned BLAKE3 tool
        run: cargo install b3sum --locked --version "$B3SUM_VERSION"
      - name: Resolve pinned runtime builder
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open("release/runtime-compatibility.toml", "rb") as file:
              metadata = tomllib.load(file)["runtime"]
          print(f"RUNTIME_VERSION={metadata['version']}")
          print(f"RUNTIME_TAG={metadata['tag']}")
          print(f"RUNTIME_REPOSITORY={metadata['repository']}")
          print(f"RUNTIME_IDENTITY={metadata['release-workflow-identity']}")
          PY
          TARGET=x86_64-unknown-linux-gnu
          ASSET="astrid-${RUNTIME_VERSION}-${TARGET}.tar.gz"
          BASE="https://github.com/${RUNTIME_REPOSITORY}/releases/download/${RUNTIME_TAG}"
          curl --proto '=https' --tlsv1.2 -fsSLO "$BASE/$ASSET"
          curl --proto '=https' --tlsv1.2 -fsSLO "$BASE/BLAKE3SUMS.txt"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ASSET.sigstore.json" "$BASE/$ASSET.sigstore.json"
          EXPECTED=$(awk -v asset="$ASSET" '$2 == asset { print $1; exit }' BLAKE3SUMS.txt)
          test -n "$EXPECTED"
          test "$(b3sum -- "$ASSET" | awk '{print $1}')" = "$EXPECTED"
          echo "RUNTIME_ASSET=$ASSET" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify pinned runtime builder identity
        run: |
          cosign verify-blob \
            --bundle "$RUNTIME_ASSET.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$RUNTIME_IDENTITY" \
            "$RUNTIME_ASSET"
      - name: Fetch and verify the immutable system object
        env:
          SYSTEM_URL: ${{ secrets.LINUX_SYSTEM_SQUASHFS_URL }}
          EXPECTED_BLAKE3: c436bb2bfe0941f183f58f0e2e56df05a4bc03f01147ad1d095f48df0004afaa
          EXPECTED_SHA256: 4460e0cdc883922a4ab68180f4ed8f0752cf34fe4659d14e3260826d20d1063a
          EXPECTED_BYTES: '333258752'
        run: |
          [[ "$SYSTEM_URL" == https://* ]] || {
            echo "LINUX_SYSTEM_SQUASHFS_URL must be an HTTPS secret" >&2
            exit 1
          }
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location "$SYSTEM_URL" --output linux-system.squashfs
          test "$(wc -c < linux-system.squashfs | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(b3sum linux-system.squashfs | awk '{print $1}')" = "$EXPECTED_BLAKE3"
          test "$(sha256sum linux-system.squashfs | awk '{print $1}')" = "$EXPECTED_SHA256"
          install -m 0644 linux-system.squashfs \
            capsules/capsule-linux-realm/assets/linux-system.squashfs
      - name: Build canonical candidate one
        run: |
          cd capsules/capsule-linux-realm
          "$RUNNER_TEMP/astrid-build" --output build-output
          python3 scripts/canonical_package.py --builder build-output/aos-linux-realm.capsule
          python3 scripts/validate_capsule.py --source-sha "$GITHUB_SHA"
      - name: Rebuild candidate two from a clean builder target
        run: |
          cd capsules/capsule-linux-realm
          rm -rf target build-output
          "$RUNNER_TEMP/astrid-build" --output build-output
          python3 scripts/canonical_package.py \
            --builder build-output/aos-linux-realm.capsule \
            --output dist/aos-linux-realm.capsule.second
          python3 scripts/validate_capsule.py \
            dist/aos-linux-realm.capsule.second \
            --source-sha "$GITHUB_SHA"
          cmp dist/aos-linux-realm.capsule dist/aos-linux-realm.capsule.second
          b3sum dist/aos-linux-realm.capsule dist/aos-linux-realm.capsule.second
          sha256sum dist/aos-linux-realm.capsule dist/aos-linux-realm.capsule.second
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            capsules/capsule-linux-realm/dist/aos-linux-realm.capsule
            capsules/capsule-linux-realm/dist/aos-linux-realm.capsule.lineage.json
      - name: Sign the candidate and lineage manifest
        env:
          COSIGN_YES: 'true'
        run: |
          cd capsules/capsule-linux-realm/dist
          cosign sign-blob --yes \
            --bundle aos-linux-realm.capsule.sigstore.json \
            aos-linux-realm.capsule
          cosign sign-blob --yes \
            --bundle aos-linux-realm.capsule.lineage.json.sigstore.json \
            aos-linux-realm.capsule.lineage.json
      - name: Verify the exact workflow identity
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/${GITHUB_WORKFLOW_REF##*/}@${GITHUB_REF}"
          cd capsules/capsule-linux-realm/dist
          for pair in \
            'aos-linux-realm.capsule aos-linux-realm.capsule.sigstore.json' \
            'aos-linux-realm.capsule.lineage.json aos-linux-realm.capsule.lineage.json.sigstore.json'
          do
            read -r asset bundle <<EOF
          $pair
          EOF
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$IDENTITY" \
              --use-signed-timestamps \
              "$asset"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aos-linux-realm-private-lineage-${{ github.sha }}
          path: |
            capsules/capsule-linux-realm/dist/aos-linux-realm.capsule
            capsules/capsule-linux-realm/dist/aos-linux-realm.capsule.lineage.json
            capsules/capsule-linux-realm/dist/*.sigstore.json
          if-no-files-found: error
