[package]
name = "capsule-workspace-recipes"
version = "0.1.0"
edition = "2024"
description = "Fixture adapter for adaptive workspace recipe persistence and recovery"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "capsule_workspace_recipes"
path = "src/lib.rs"

[dependencies]
capsule-surface-model = { path = "../capsule-surface-model" }
blake3 = "=1.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
